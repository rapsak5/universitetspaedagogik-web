# Giver Bing og de andre IndexNow-søgemaskiner besked, hver gang hjemmesiden udgives på main.
# Nøglen ligger som <32 hex-tegn>.txt i roden. Domænet læses fra CNAME.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml', 'llms.txt']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vent på GitHub Pages
        run: sleep 90
      - name: Send adresserne
        run: |
          HOST=$(tr -d '[:space:]' < CNAME)
          KEY=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          EXTRA=""; [ -f llms.txt ] && EXTRA="https://$HOST/llms.txt"
          URLS=$( { grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g'; if [ -n "$EXTRA" ]; then echo "$EXTRA"; fi; } | jq -R . | jq -s -c .)
          BODY=$(jq -n -c --arg h "$HOST" --arg k "$KEY" --argjson u "$URLS" '{host:$h,key:$k,keyLocation:("https://"+$h+"/"+$k+".txt"),urlList:$u}')
          echo "$BODY"
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
